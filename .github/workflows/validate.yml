name: validate

# 이 저장소는 매니페스트와 문서를 담는다. 그러니 CI 도 그것을 검증한다 —
# 통과시키려고 도는 빈 워크플로가 아니라, 실제로 깨질 수 있는 것을 잰다.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # 주 1회 — 원격 엔드포인트가 조용히 죽는 것을 잡는다

jobs:
  manifest:
    name: manifest and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: server.json is valid JSON and matches the published schema
        run: |
          python3 -c "import json; json.load(open('server.json'))"
          curl -sSfL -o schema.json \
            "$(python3 -c "import json;print(json.load(open('server.json'))['\$schema'])")"
          python3 - <<'PY'
          import json, urllib.request
          d = json.load(open("server.json"))
          for k in ("name", "description", "version", "remotes"):
              assert k in d, f"server.json missing required key: {k}"
          assert len(d["description"]) <= 100, \
              f"registry limit: description must be <= 100 chars, got {len(d['description'])}"
          assert d["remotes"] and d["remotes"][0].get("url"), "no remote endpoint declared"
          print("server.json ok —", d["name"], d["version"])
          PY

      - name: glama.json is valid
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("glama.json"))
          assert d.get("maintainers"), "glama.json must list maintainers"
          print("glama.json ok —", d["maintainers"])
          PY

      - name: the endpoint we advertise is alive and still requires auth
        run: |
          URL=$(python3 -c "import json;print(json.load(open('server.json'))['remotes'][0]['url'])")
          echo "checking $URL"
          # tools/call must be refused without a key — an open endpoint would be an incident
          CALL=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"k_snippets","arguments":{"question":"x"}}}')
          # tools/list is intentionally open so registries can discover the catalog
          LIST=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          echo "tools/call=$CALL tools/list=$LIST"
          test "$CALL" = "401" || { echo "::error::serving must require auth (got $CALL)"; exit 1; }
          test "$LIST" = "200" || { echo "::error::discovery must stay open (got $LIST)"; exit 1; }

      - name: links in README resolve
        run: |
          python3 - <<'PY'
          import json, re, subprocess, sys
          urls = sorted(set(re.findall(r'https?://[^\s)\]"<>`]+', open("README.md").read())))
          bad = []
          # the MCP endpoint is checked in the step above, where 401 is the CORRECT answer.
          # a link checker that calls it "broken" is measuring the wrong thing.
          endpoint = json.load(open("server.json"))["remotes"][0]["url"].rstrip("/")
          for u in urls:
              u = u.rstrip('.,`')
              if "badges" in u or "shields.io" in u:
                  continue
              if u.rstrip("/") == endpoint:
                  continue
              code = subprocess.run(["curl", "-s", "-o", "/dev/null", "-w", "%{http_code}",
                                     "-L", "--max-time", "25", u],
                                    capture_output=True, text=True).stdout.strip()
              if code not in ("200", "403"):
                  bad.append((u, code))
          for u, c in bad:
              print(f"::error::broken link {u} -> {c}")
          sys.exit(1 if bad else 0)
          PY
